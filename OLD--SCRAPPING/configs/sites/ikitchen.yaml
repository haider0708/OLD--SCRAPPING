# Ikitchen.com.tn - Shopify, no CF, uses /products.json API
base_url: "https://ikitchen.com.tn"

settings:
  max_retries: 3
  retry_delay: 2
  max_consecutive_failures: 10
  request_timeout: 30
  page_timeout: 30000
  wait_after_load: 1

selectors:
  frontpage:
    nav_container: "nav, header"
    top_level_blocks: "li"
    top_level_link: "a[href*='/collections/']"
    sub_items: "li ul li a"

  category_page:
    item_selector: ".product-card__wrapper, [class*=product-card]"
    item_name: ".product-card__title, h2, h3"
    item_url: "a[href*='/products/']"
    item_image: "img"
    item_image_attrs: ["src", "data-src"]
    item_price: ".product-card__price, [class*=price]"
    pagination_next: "a[href*='?page='], a[rel='next']"
    pagination_param: "page"

  product_page:
    title: "h1, .product-title, [itemprop='name']"
    price: "[itemprop='price'], .product__price, .price"
    sku: "[itemprop='sku'], .product-sku"
    availability: "[itemprop='availability'], .availability, .stock"
    description: ".product__description, .product-description"
    image_main: ".product__media img, .product-single__media img"
    image_thumbnails: ".product__thumbnails img"
