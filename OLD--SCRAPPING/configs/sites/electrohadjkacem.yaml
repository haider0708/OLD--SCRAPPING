# Electrohadjkacem.com - WooCommerce WoodMart theme, no CF, httpx
base_url: "https://electrohadjkacem.com"

settings:
  max_retries: 3
  retry_delay: 2
  max_consecutive_failures: 10
  request_timeout: 30
  page_timeout: 30000
  wait_after_load: 1

selectors:
  frontpage:
    wait_selector: "div.wd-product, ul.products"
    nav_container: "nav, .woocommerce-breadcrumb"
    top_level_blocks: "li.menu-item"
    top_level_link: "a"
    sub_items: "ul.sub-menu li.menu-item a"

  category_page:
    item_selector: "div.wd-product, div.product-grid-item.type-product"
    item_name: ".wd-entities-title, h2.woocommerce-loop-product__title, h3"
    item_url: "a.wd-entities-title-link, a.product-link, a"
    item_image: "img.attachment-woocommerce_thumbnail, img.wd-img, img"
    item_image_attrs: ["src", "data-src", "data-lazy-src"]
    item_price: "span.woocommerce-Price-amount bdi, .price bdi"
    item_old_price: "del span.woocommerce-Price-amount bdi"
    pagination_next: "a.next.page-numbers"
    pagination_param: "page"

  product_page:
    title: "h1.product_title, h1.entry-title"
    price: "p.price ins span.woocommerce-Price-amount bdi, p.price span.woocommerce-Price-amount bdi"
    old_price: "p.price del span.woocommerce-Price-amount bdi"
    sku: "span.sku"
    availability: "p.stock.in-stock, p.stock.out-of-stock"
    description: "div.woocommerce-product-details__short-description"
    specs_container: "table.woocommerce-product-attributes"
    specs_key: "th.woocommerce-product-attributes-item__label"
    specs_value: "td.woocommerce-product-attributes-item__value"
    image_main: "div.woocommerce-product-gallery__image img"
    image_thumbnails: ".woocommerce-product-gallery img"
