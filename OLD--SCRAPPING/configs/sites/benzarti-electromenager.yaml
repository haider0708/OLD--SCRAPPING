# Benzarti Electromenager - WordPress/WooCommerce + Elementor/OceanWP, httpx
base_url: "https://benzarti-electromenager.com"

settings:
  max_retries: 3
  retry_delay: 2
  max_consecutive_failures: 10
  request_timeout: 30
  page_timeout: 30000
  wait_after_load: 1

selectors:
  frontpage:
    menu_links: "nav .elementskit-navbar-nav li.menu-item-object-product_cat > a[href*='/categorie-produit/']"
    widget_links: ".jet-woo-category-title a[href*='/categorie-produit/'], .jet-woo-categories__item a[href*='/categorie-produit/']"
    fallback_links: "nav a[href*='/categorie-produit/'], header a[href*='/categorie-produit/'], footer a[href*='/categorie-produit/']"
    sitemap_url: "https://benzarti-electromenager.com/product_cat-sitemap.xml"

  category_page:
    item_selector: "li.product.type-product"
    item_url: ".woo-entry-inner li.title a[href*='/boutique/'], a.woocommerce-LoopProduct-link[href*='/boutique/']"
    item_name: ".woo-entry-inner li.title a, .woo-entry-inner li.title h2, h2"
    item_id: "a.add_to_cart_button[data-product_id], [data-product_id]"
    item_sku: "a.add_to_cart_button[data-product_sku], [data-product_sku]"
    item_price: ".price .woocommerce-Price-amount bdi, .woocommerce-Price-amount bdi"
    item_current_price: "ins .woocommerce-Price-amount bdi, .price .woocommerce-Price-amount bdi"
    item_old_price: "del .woocommerce-Price-amount bdi"
    item_discount: ".onsale, .product-label.onsale"
    item_description: ".woo-entry-inner li.woo-desc, li.woo-desc"
    item_image: "img.woo-entry-image-main, .woo-entry-image img, img"
    item_image_attrs: ["data-src", "data-large_image", "data-srcset", "srcset", "src"]
    pagination_pages: "nav.woocommerce-pagination a.page-numbers, ul.page-numbers a, a.page-numbers"
    pagination_current: "nav.woocommerce-pagination span.page-numbers.current, ul.page-numbers span.current, span.page-numbers.current"
    pagination_next: "nav.woocommerce-pagination a.next.page-numbers, ul.page-numbers a.next, a.next.page-numbers"

  product_page:
    title: ".elementor-heading-title, [itemprop='name'].entry-title, .entry-title, h1.product_title, h1.entry-title, h1"
    product_id: "button[name='add-to-cart'][value], form.cart button[name='add-to-cart'][value], [data-product_id], [data-product-id]"
    sku: ".sku_wrapper .sku"
    price: ".product_price .woocommerce-Price-amount bdi, p.price .woocommerce-Price-amount bdi, .price .woocommerce-Price-amount bdi"
    current_price: "p.price ins .woocommerce-Price-amount bdi, .product_price ins .woocommerce-Price-amount bdi"
    old_price: "p.price del .woocommerce-Price-amount bdi, .product_price del .woocommerce-Price-amount bdi"
    availability: ".stock, .out-of-stock, .in-stock, .woocommerce-variation-availability"
    description_meta: "meta[property='og:description'][content], meta[name='description'][content]"
    image_meta: "meta[property='og:image'][content], meta[itemprop='image'][content]"
    images: "img"
    image_attrs: ["data-large_image", "data-src", "data-srcset", "srcset", "src"]
