# Krichen Distribution - WordPress/WooCommerce + Woodmart, httpx
base_url: "https://www.krichen-distribution.tn"

settings:
  max_retries: 3
  retry_delay: 2
  max_consecutive_failures: 10
  request_timeout: 30
  page_timeout: 30000
  wait_after_load: 1
  max_pagination_pages: 80

selectors:
  frontpage:
    top_level_items: "ul#menu-main-navigation > li.menu-item, ul.wd-nav-main > li.menu-item"
    mobile_items: ".wd-nav-mobile li.menu-item, .mobile-nav li.menu-item"
    fallback_links: "header a[href], nav a[href], .wd-header-nav a[href], .wd-nav-mobile a[href]"
    category_tiles: ".products .product-category, .product-category"
    category_tile_link: ".wd-entities-title a[href], h3.wd-entities-title a[href], a.wd-fill[href], a[href]"
    category_api: "https://www.krichen-distribution.tn/wp-json/wp/v2/product_cat"
    category_sitemap: "https://www.krichen-distribution.tn/product_cat-sitemap.xml"

  category_page:
    item_selector: "div.product.type-product, li.product.type-product"
    item_url: ".wd-entities-title a[href*='/boutique/'], h3.wd-entities-title a[href*='/boutique/'], h2.wd-entities-title a[href*='/boutique/'], a.product-image-link[href*='/boutique/']"
    item_id: "a.add_to_cart_button[data-product_id], [data-product_id]"
    item_sku: "a.add_to_cart_button[data-product_sku], [data-product_sku]"
    item_price: ".price .woocommerce-Price-amount bdi, .woocommerce-Price-amount bdi"
    item_current_price: "ins .woocommerce-Price-amount bdi, .price ins .woocommerce-Price-amount bdi"
    item_old_price: "del .woocommerce-Price-amount bdi, .price del .woocommerce-Price-amount bdi"
    item_discount: ".onsale.product-label, .product-label.onsale"
    item_image: ".product-image-link img.attachment-woocommerce_thumbnail, .product-image-link img.wp-post-image, .product-image-link img"
    item_image_attrs: ["data-large_image", "data-src", "src", "srcset"]
    item_brand: ".product-labels [class*='label-attribute-pa_brand'], .product-labels [class*='label-term-']"
    pagination_next: ".wd-load-more[href*='/page/'], a.next.page-numbers[href]"
    pagination_pages: "nav.woocommerce-pagination a.page-numbers[href], a.page-numbers[href], .wd-load-more[href*='/page/']"

  product_page:
    title: "h1.product_title, h1.entry-title"
    product_id: "button[name='add-to-cart'][value], form.cart [name='add-to-cart'][value], input[name='product_id'][value]"
    sku: ".sku_wrapper .sku, span.sku"
    price: "p.price .woocommerce-Price-amount bdi, .summary .price .woocommerce-Price-amount bdi"
    current_price: "p.price ins .woocommerce-Price-amount bdi, .summary .price ins .woocommerce-Price-amount bdi"
    old_price: "p.price del .woocommerce-Price-amount bdi, .summary .price del .woocommerce-Price-amount bdi"
    availability: ".summary .stock, .entry-summary .stock, .product-image-summary .stock, form.cart .stock"
    description: ".woocommerce-product-details__short-description, #tab-description, .woocommerce-Tabs-panel--description, .wc-tab"
    specs_rows: "table.shop_attributes tr, table.woocommerce-product-attributes tr"
    image_gallery: ".woocommerce-product-gallery__image img, .woocommerce-product-gallery img, img.wp-post-image"
    breadcrumbs: ".woocommerce-breadcrumb a, nav.woocommerce-breadcrumb a, .breadcrumb a"
    brand: ".wd-product-brands a, .product-brands a, .brand a"
