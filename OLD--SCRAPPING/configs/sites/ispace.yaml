# iSpace Services - WordPress/WooCommerce + Elementor, httpx
base_url: "https://ispaceservices.com"

settings:
  max_retries: 3
  retry_delay: 2
  max_consecutive_failures: 10
  request_timeout: 30
  page_timeout: 30000
  wait_after_load: 1

selectors:
  frontpage:
    nav_links: ".elementor-nav-menu a[href], header a[href], nav a[href]"

  category_page:
    item_selector: "div.product.type-product"
    item_id: "a.button[data-product_id], a.add_to_cart_button[data-product_id]"
    item_url: "a.woocommerce-loop-product__link[href*='/product/']"
    item_name: "a.woocommerce-loop-product__link[href*='/product/']"
    item_price: ".price .woocommerce-Price-amount bdi, .woocommerce-Price-amount bdi, bdi"
    item_current_price: "ins .woocommerce-Price-amount bdi, .price ins .woocommerce-Price-amount bdi"
    item_old_price: "del .woocommerce-Price-amount bdi, .price del .woocommerce-Price-amount bdi"
    item_sku: "a.button[data-product_sku], a.add_to_cart_button[data-product_sku]"
    item_image: "img"
    item_image_attrs: ["data-src", "src", "data-large_image", "srcset"]
    pagination_pages: "nav.woocommerce-pagination a.page-numbers"
    pagination_next: "nav.woocommerce-pagination a.next.page-numbers, a.next.page-numbers"

  product_page:
    title: "h1.product_title, h1.entry-title, h1"
    product_id: "input[name='product_id'][value], button[name='add-to-cart'][value], form.variations_form[data-product_id]"
    sku: ".sku_wrapper .sku"
    price: "p.price .woocommerce-Price-amount bdi, .summary .price .woocommerce-Price-amount bdi"
    old_price: "p.price del .woocommerce-Price-amount bdi, .summary .price del .woocommerce-Price-amount bdi"
    availability: ".stock"
    overview: ".woocommerce-product-details__short-description"
    description: "#tab-description, .woocommerce-Tabs-panel--description"
    specs_rows: ".woocommerce-product-attributes tr"
    variations_form: "form.variations_form[data-product_variations]"
    variation_options: "table.variations tr"
    image_gallery: ".woocommerce-product-gallery img, img.wp-post-image"
