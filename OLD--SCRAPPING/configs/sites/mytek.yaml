# ============================================================
# Mytek.tn Scraper Configuration
# ============================================================
# Site: https://www.mytek.tn (Tunisian E-commerce)
# Platform: Magento 2 — products in static SEO data layer + JS-rendered cards

site_name: "mytek"
base_url: "https://www.mytek.tn"

# === SCRAPER SETTINGS ===
settings:
  max_retries: 3
  retry_delay: 5 # seconds, exponential backoff
  max_consecutive_failures: 10
  page_timeout: 60000 # milliseconds
  wait_after_load: 0 # no extra sleep needed — data is in static HTML

# === SELECTORS ===
selectors:
  # --- FRONTPAGE (Category Hierarchy) ---
  # The navigation menu is JavaScript-rendered; Playwright fetches it.
  frontpage:
    # Top-level categories (14 total): INFORMATIQUE, GAMING, TELEPHONIE, etc.
    top_level_blocks: "li.rootverticalnav.category-item"
    top_level_title: "> a"

    # Low-level categories within each top-level
    low_level_blocks: ".grid-item-6.clearfix"
    low_level_title: ".title_normal > a"
    low_level_link: ".title_normal > a"

    # Subcategories (deepest level)
    subcategory_blocks: ".level3-popup li.category-item"
    subcategory_title: ".level3-name"
    subcategory_link: "a.clearfix"

  # --- CATEGORY PAGE (Product Listings) ---
  # Products are extracted from the hidden SEO data layer (#seo-product-data)
  # which is present in the raw server-rendered HTML — no JS execution needed.
  #
  # SEO data layer structure (one <div> per product):
  #   <div id="seo-product-data">
  #     <div data-id="59932"
  #          data-sku="9U1B9EA"
  #          data-name="PC Portable Gamer HP Victus ..."
  #          data-url="/pc-portable-...html"
  #          data-image="/media/catalog/product/..."
  #          data-price="2359"
  #          data-final-price="2259"
  #          data-erpstock="En stock"
  #          data-manufacturer="HP">
  #     </div>
  #     ...
  #   </div>
  category_page:
    # Wait selector — always present in static HTML before JS runs
    wait_selector: "#seo-product-data > div[data-id]"

    # SEO data layer container
    seo_container: "#seo-product-data > div[data-id]"

    # Data attributes on each SEO item
    attr_id: "data-id"
    attr_sku: "data-sku"
    attr_name: "data-name"
    attr_url: "data-url"
    attr_image: "data-image"
    attr_price: "data-price"
    attr_final_price: "data-final-price"
    attr_stock: "data-erpstock"
    attr_brand: "data-manufacturer"

    # JS-rendered product cards (fallback reference, not used for extraction)
    js_card_container: "#product-cards-row"
    js_card_selector: "#product-cards-row .product-container"

    # Pagination — Bootstrap nav rendered server-side
    pagination_container: ".pagination-container"
    pagination_active: ".pagination .page-item.active .page-link"
    pagination_all_links: ".pagination .page-item .page-link"
    pagination_next_item: ".pagination .page-item:last-child"

    # URL pattern for pagination
    pagination_param: "p" # ?p=2, ?p=3, …

  # --- PRODUCT PAGE (Detail Scraping) ---
  product_page:
    # Title
    title: ".page-title-wrapper h1 span.base"

    # SKU and brand
    sku: ".product.attribute.sku .value"
    brand_logo: ".product-info-stock-sku a img"

    # Overview / Description
    overview: ".product.attribute.overview .value, #description .product-description, .product-description"
    description: "#description .product-description, .product-description"

    # Pricing — use meta[itemprop="price"] (single occurrence, always correct)
    price_meta: "meta[itemprop='price']"
    price_attr: "content"
    old_price_container: "[itemprop='offers']"

    # Specifications table
    specs_table: "#product-attribute-specs-table"
    specs_row: "tbody tr"
    specs_label: "th.label"
    specs_value: "td.data"

    # Images
    main_image: "[itemprop='image']"
    gallery_images: "#gallery-container .carousel-item img"

    # Availability
    stock_div: "[data-role='stockStatus'], .product-info-stock-sku .stock, [itemprop='availability']"

    # Store availability table
    store_table: ".tab_retrait_mag"
    store_name: ".mag_name a"
    store_status: ".stock-status-placeholder"

# === NOTES ===
# - Frontpage menu: JavaScript-rendered → fetched with Playwright (headless)
# - Category pages: products in static #seo-product-data → domcontentloaded only
# - Pagination: Bootstrap nav, server-rendered, sliding window handled by has_next flag
# - ~48 products per page; pagination param is ?p=N
# - Product detail pages: fully JS-rendered → scraped with Playwright evaluate()
