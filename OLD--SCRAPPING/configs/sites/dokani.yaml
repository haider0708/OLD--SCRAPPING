# Dokani.tn - Odoo TP Shop, no CF, httpx
base_url: "https://www.dokani.tn"

settings:
  max_retries: 3
  retry_delay: 2
  max_consecutive_failures: 10
  request_timeout: 30
  page_timeout: 30000
  wait_after_load: 1

selectors:
  frontpage:
    nav_container: "nav, .navbar, header"
    top_level_blocks: "li.nav-item, li"
    top_level_link: "a"
    sub_items: "ul.dropdown-menu li a"

  category_page:
    item_selector: ".tp-product-item, div[class*=tp-product-item]"
    item_name: ".tp-product-title, h5.product-title, h4, h5, h3"
    item_url: "a[href*='/shop/']"
    item_image: "img"
    item_image_attrs: ["src", "data-src", "data-lazy-src"]
    item_price: ".product_price, [class*=price]"
    pagination_next: "a[href*='/page/']"
    pagination_param: "page"

  product_page:
    title: "h1, .product-title, [itemprop='name']"
    price: ".product_price, [class*=price], [itemprop='price']"
    sku: ".product-reference, [itemprop='sku']"
    availability: ".availability, .stock, [class*=stock]"
    description: "#description, .product-description, .tab-pane#description"
    image_main: ".product-cover img, img[itemprop='image'], #o-carousel-product img"
    image_thumbnails: ".o_product_page_gallery img, .carousel-indicators img"
