# Electrochaabani.com - Custom PHP platform, no CF, httpx
base_url: "https://www.electrochaabani.com"

settings:
  max_retries: 3
  retry_delay: 2
  max_consecutive_failures: 10
  request_timeout: 30
  page_timeout: 30000
  wait_after_load: 1

selectors:
  frontpage:
    nav_container: "nav, .main-nav, header ul"
    top_level_blocks: "li"
    top_level_link: "a"
    sub_items: "ul li a"

  category_page:
    item_selector: "div.product-card, div.product-item, .shop-tab-product"
    item_name: ".product-name, .product-title, h3, h4"
    item_url: "a[href*='/produit/'], a[href*='/product/']"
    item_image: "img"
    item_image_attrs: ["src", "data-src"]
    item_price: ".price, [class*=price]"
    pagination_next: ".pagination a[href*='page=']"
    pagination_param: "page"

  product_page:
    title: "h1, .product-title, .product-name"
    price: ".price, [class*=price]"
    sku: ".reference, .sku, [class*=reference]"
    availability: ".stock, .availability, [class*=stock]"
    description: ".product-description, .description, #description"
    image_main: ".product-image img, .main-image img, img[itemprop='image']"
    image_thumbnails: ".product-thumbnails img, .gallery img"
