# Taktek.com.tn - PrestaShop, no Cloudflare, httpx
base_url: "https://taktek.com.tn"

settings:
  max_retries: 3
  retry_delay: 2
  max_consecutive_failures: 10
  request_timeout: 30
  page_timeout: 30000
  wait_after_load: 1

selectors:
  frontpage:
    wait_selector: "nav ul.menu-content li.level-1 > a, ul#top-menu li.top-level-elem > a"
    nav_container: "nav ul.menu-content, ul#top-menu"
    top_level_blocks: "li.level-1, li.top-level-elem"
    top_level_link: "a"
    sub_items: "ul.menu-dropdown li.level-2 a, ul.sub-menu li a"

  category_page:
    item_selector: "article.product-miniature"
    item_id_attr: "data-id-product"
    item_name: "h6[itemprop='name'], h2.product-title a, h3.product-title a, .product-title a"
    item_url: "a.thumbnail.product-thumbnail, h2.product-title a, h3.product-title a"
    item_image: "img.img-fluid, img.img-responsive"
    item_image_attrs: ["src", "data-src", "data-lazy-src"]
    item_price: "span[itemprop='price'], span.price"
    item_old_price: "span.regular-price"
    pagination_next: "a.next.js-search-link, a[rel='next']"
    pagination_param: "page"

  product_page:
    title: "h1[itemprop='name'], h1.h1"
    price: "span[itemprop='price'], div.current-price span.price"
    price_content_attr: "content"
    old_price: "span.regular-price"
    sku: "span[itemprop='sku'], div.product-reference span"
    brand: "div.product-manufacturer img, .manufacturer img"
    brand_attr: "alt"
    availability: "span#product-availability, div.product-availability"
    availability_schema: "link[itemprop='availability'][href]"
    description: "div.product-description, div#description div.product-description"
    specs_container: "section.product-features, div.product-features"
    specs_key: "dt.name, dt"
    specs_value: "dd.value, dd"
    image_main: "div.product-cover img, img[itemprop='image']"
    image_thumbnails: "img.thumb.js-thumb, ul.product-images img"
