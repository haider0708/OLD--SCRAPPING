# Tuttosport.com.tn - PrestaShop, httpx (no Cloudflare)
base_url: "https://www.tuttosport.com.tn"

settings:
  max_retries: 3
  retry_delay: 1
  max_consecutive_failures: 10
  request_timeout: 30
  page_timeout: 30000
  wait_after_load: 0

selectors:
  frontpage:
    top_level_blocks: "#top-menu > li, ul.top-menu > li"
    top_level_link: "> a"
    sub_items: "ul li a"

  category_page:
    item_selector: "div.product-miniature, article.product-miniature, .js-product-miniature"
    item_name: "h3.product-title, h2.product-title, .product-title"
    item_url: "a.thumbnail, a.product-thumbnail"
    item_image: "img.js-image-product, img.img-responsive"
    item_image_attrs: ["src", "data-src"]
    item_price: "span.price"
    item_old_price: "span.regular-price"
    pagination_next: "a[rel='next'], .pagination li.next a"
    pagination_param: "page"

  product_page:
    title: "h1.page-title, h1[itemprop='name'], h1"
    price: ".current-price span.price, [itemprop='price']"
    old_price: ".product-price .regular-price, .has-discount .regular-price"
    sku: ".product-reference span, [itemprop='sku']"
    availability: ".product-available, .in-stock, .out-of-stock"
    description: "#product-description-short, [itemprop='description'], #tab-description"
    brand: ".product-manufacturer a, [itemprop='brand']"
    image_main: ".product-cover img"
    image_thumbnails: ".product-images img, #product-images-large img"
