# iTechStore.tn - PrestaShop + IqitElementor/IqitMegaMenu, httpx
base_url: "https://itechstore.tn"

settings:
  max_retries: 3
  retry_delay: 2
  max_consecutive_failures: 10
  request_timeout: 30
  page_timeout: 30000
  wait_after_load: 1

selectors:
  frontpage:
    nav_container: "#iqitmegamenu-mobile"
    top_level_items: "ul.mobile-menu__scroller > li.mobile-menu__tab"
    link: "a.mobile-menu__link, a.nav-link"
    submenu: "ul.mobile-menu__submenu"

  category_page:
    item_selector: "#js-product-list article.product-miniature, article.product-miniature.js-product-miniature"
    item_url: "a.thumbnail.product-thumbnail, h2.product-title a, .product-title a"
    item_name: "h2.product-title a, .product-title a"
    item_price: "span.product-price"
    item_old_price: ".regular-price"
    item_brand: ".product-brand"
    item_reference: ".product-reference"
    item_availability: ".product-availability span, .product-available"
    item_image: "a.thumbnail.product-thumbnail img, img.product-thumbnail-first, img"
    item_image_attrs: ["data-full-size-image-url", "data-src", "src"]
    pagination_pages: ".pagination .page-list a.js-search-link"
    pagination_next: ".pagination a.next.js-search-link, a.next.js-search-link"
    pagination_param: "page"

  product_page:
    title: "h1.h1.page-title, h1.h1"
    product_id: "input[name='id_product'][value]"
    reference: ".product-reference span"
    brand_image: ".product-manufacturer img[alt]"
    brand_link: ".product-manufacturer a"
    price: ".product-prices .current-price span.product-price, .product-prices .current-price span"
    old_price: ".product-prices .regular-price, .regular-price"
    availability: "#product-availability"
    description: "#description .product-description, #description"
    specs_key: ".product-features .data-sheet dt.name"
    specs_value: ".product-features .data-sheet dd.value"
    image_main: ".product-cover img"
    image_gallery: ".images-container img, .thumb-container img"
