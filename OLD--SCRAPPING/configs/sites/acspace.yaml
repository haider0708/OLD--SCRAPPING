# Acspace.tn - WordPress + WooCommerce + Bricks Builder, httpx, no Cloudflare
base_url: "https://acspace.tn"

settings:
  max_retries: 3
  retry_delay: 2
  max_consecutive_failures: 10
  request_timeout: 30
  page_timeout: 30000
  wait_after_load: 1

selectors:
  frontpage:
    wait_selector: ".splide__list a, a.brxe-text-link"
    nav_container: ".splide__list"
    top_level_blocks: ".splide__slide"
    top_level_link: "a.brxe-text-link"
    top_level_name: "a.brxe-text-link"

  category_page:
    item_selector: "div.bt-product-21__product-card, li.product.type-product"
    item_name: "h2 a, h3 a, h2, h3"
    item_url: "figure a[href], a[href*='/produit/']"
    item_image: "figure img, img.wp-post-image"
    item_image_attrs: ["data-src", "src"]
    item_price: "div.bt-product-21__price span.woocommerce-Price-amount bdi, span.woocommerce-Price-amount bdi"
    item_old_price: "span.price del span.woocommerce-Price-amount bdi"
    item_sku: "span.sku"
    pagination_next: "a.next.page-numbers"
    pagination_param: "paged"

  product_page:
    title: "h1.product_title, h1"
    price: "p.price span.woocommerce-Price-amount bdi"
    price_sale: "p.price ins span.woocommerce-Price-amount bdi"
    price_original: "p.price del span.woocommerce-Price-amount bdi"
    sku: ".sku_wrapper span.sku, span.sku"
    availability_in_stock: "p.stock.in-stock"
    availability_out: "p.stock.out-of-stock"
    description: "div.woocommerce-product-details__short-description"
    specs_container: "table.shop_attributes"
    specs_key: "th"
    specs_value: "td"
    image_gallery: "div.woocommerce-product-gallery__image img"
