# Bill.tn - Shopify (Electro Theme), Cloudflare proxy only, httpx
# Uses Shopify /products.json API for listings
base_url: "https://bill.tn"

settings:
  max_retries: 3
  retry_delay: 2
  max_consecutive_failures: 10
  request_timeout: 30
  page_timeout: 30000
  wait_after_load: 1

selectors:
  frontpage:
    wait_selector: "ul.menu-list > li.menu-item > a"
    nav_container: "ul.menu-list"
    top_level_blocks: "ul.menu-list > li.menu-item"
    top_level_link: "a"
    top_level_name: "a"
    sub_items: "div.dropdown-menu_wrapper ul.menu-list li.menu-item a"

  category_page:
    item_selector: "product-card, section.product-card"
    item_name: "h3.product-card_title"
    item_url: "a[href*='/products/']"
    item_image: "img"
    item_image_attrs: ["src", "data-src"]
    item_price: "div.product-price div.price-sale, div.product-price"
    pagination_next: "a[rel='next']"
    pagination_param: "page"

  product_page:
    title: "h1.product-single__title, h1[itemprop='name'], h1"
    price: "span.product-price__price, span[itemprop='price']"
    sku: "span.product-single__sku-number, span.sku"
    availability: "span.product-single__availability"
    description: "div.product-single__description, div.product__description"
    image_main: "div.product-single__media img"
