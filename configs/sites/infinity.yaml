# My Infinity - WordPress/WooCommerce storefront with Store API.

site_name: "infinity"
base_url: "https://myinfinity.tn/"
store_api_base_url: "https://myinfinity.tn/wp-json/wc/store/v1"

settings:
  max_retries: 3
  retry_delay: 2
  max_consecutive_failures: 10
  request_timeout: 30
  page_timeout: 30000
  wait_after_load: 1
  page_size: 12
  max_pages: 100

headers:
  Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,application/json;q=0.8,*/*;q=0.7"
  Accept-Language: "fr-FR,fr;q=0.9,en;q=0.8"

fixed_categories:
  - name: "Montres Homme"
    url: "https://myinfinity.tn/product-category/montres-homme/"
    slug: "montres-homme"
    category_id: "16"
  - name: "Montres Femme"
    url: "https://myinfinity.tn/product-category/montres-femme/"
    slug: "montres-femme"
    category_id: "17"

selectors:
  frontpage:
    category_links: "a[href*='/product-category/montres-homme/'], a[href*='/product-category/montres-femme/']"
    store_categories_api: "/products/categories"

  categories:
    allowed_slugs: ["montres-homme", "montres-femme"]
    category_url: "/product-category/{slug}/"

  category_page:
    synthetic_payload: "script#infinity-listing-data"
    product_card: "ul.products li.product, li.product.type-product, .products .product"
    product_url: "a.woocommerce-LoopProduct-link[href*='/product/'], a.woocommerce-loop-product__link[href*='/product/'], a[href*='/product/']"
    product_name: ".woocommerce-loop-product__title, h2, h3"
    product_price: ".price"
    product_current_price: ".price ins .woocommerce-Price-amount, .price ins"
    product_old_price: ".price del .woocommerce-Price-amount, .price del"
    product_image: "img.woo-entry-image-main, img.wp-post-image, img.attachment-woocommerce_thumbnail, img"
    product_id: ".owp-quick-view[data-product_id], [data-product_id], [data-product-id]"
    product_brand: ".product-brand img[alt], .product-brand a, .product-brand"
    api_endpoint: "/products"

  pagination:
    method: "store_api_page"
    path_pattern: "/page/{n}/"
    page_param: "page"
    page_size: 12

  product_page:
    product_api_by_slug: "/products?slug={slug}"
    product_api_by_id: "/products/{id}"
    title: "h1.page-header-title, h2.single-post-title.product_title, h1.product_title, h2.product_title, h1"
    price: ".summary .price, p.price"
    current_price: ".summary .price ins .woocommerce-Price-amount, .summary .price ins, p.price ins .woocommerce-Price-amount, p.price ins"
    old_price: ".summary .price del .woocommerce-Price-amount, .summary .price del, p.price del .woocommerce-Price-amount, p.price del"
    short_description: ".woocommerce-product-details__short-description"
    description: "#tab-description, .woocommerce-Tabs-panel--description"
    specifications: "table.shop_attributes tr, table.woocommerce-product-attributes tr"
    image_gallery: ".woocommerce-product-gallery__image img, .woocommerce-product-gallery img, img.wp-post-image"
    breadcrumbs: ".woocommerce-breadcrumb a, nav.woocommerce-breadcrumb a, .posted_in a[href*='/product-category/']"
    availability: ".summary .stock, p.stock, .stock"
    product_id: "button[name='add-to-cart'][value], form.cart [name='add-to-cart'][value], input[name='product_id'][value], [data-product_id], [data-product-id]"
    sku: ".sku_wrapper .sku, span.sku, [itemprop='sku']"
    brand: ".product-brand img[alt], .product-brands a, .brand a"
