# BeautyStore.tn - PrestaShop + IQIT/Lab mega menu, httpx
base_url: "https://beautystore.tn"

settings:
  max_retries: 3
  retry_delay: 2
  max_consecutive_failures: 10
  request_timeout: 30
  page_timeout: 30000
  wait_after_load: 1

selectors:
  frontpage:
    nav_container: ".lab-menu-horizontal > ul.menu-content, ul.menu-content"
    top_level_items: "li.level-1"
    top_level_link: "a[href]"
    column: ".lab-sub-menu .lab-menu-col.CAT, .lab-sub-menu .lab-menu-col"
    category_links: "a[href]"
    fallback_links: "header a[href], .lab-menu-horizontal a[href], a[href]"

  category_page:
    item_selector: "#js-product-list article.product-miniature, article.product-miniature.js-product-miniature"
    item_url: "a.thumbnail.product-thumbnail, .product-title a"
    item_name: ".product-title a"
    item_price: ".product-price-and-shipping .price, span.price"
    item_old_price: ".regular-price"
    item_discount: ".product-flag.discount, .discount-percentage, .discount"
    item_brand: ".product-brand"
    item_reference: ".product-reference"
    item_availability: ".product-availability, #product-availability"
    item_image: "img[data-full-size-image-url], img[data-src], img[src]"
    item_image_attrs: ["data-full-size-image-url", "data-src", "src"]
    pagination_pages: ".pagination a, ul.page-list a, nav.pagination a"
    pagination_next: ".pagination a.next.js-search-link, nav.pagination a.next"
    pagination_param: "page"

  product_page:
    title: "h1.h1"
    product_id: "input#product_page_product_id[name='id_product'][value]"
    product_id_fallback: "meta[property='product:retailer_item_id'][content]"
    product_data: "#product-details[data-product], #product-details2[data-product]"
    reference: "meta[itemprop='sku'][content]"
    barcode: "meta[itemprop='gtin13'][content], meta[itemprop='gtin'][content]"
    brand_image: ".product-manufacturer img[alt]"
    brand_link: ".product-manufacturer a"
    brand_meta: "meta[property='product:brand'][content]"
    price: ".bloc-cart-price .cart-price-value, meta[property='product:price:amount'][content], meta[itemprop='price'][content]"
    old_price: ".bloc-cart-price .cart-price-discount"
    availability: "#product-availability"
    availability_meta: "meta[property='product:availability'][content], link[itemprop='availability'][href]"
    short_description: "#product-description-short"
    description: "#description"
    specs_key: ".product-features dt, table tr th, table tr td:first-child"
    specs_value: ".product-features dd, table tr td:last-child"
    image_main: ".product-cover img"
    image_gallery: ".images-container img, .thumb-container img"
    breadcrumbs: "[data-depth] a, .breadcrumb a"
