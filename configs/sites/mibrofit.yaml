# Mibrofit.tn - WordPress/WooCommerce + Woodmart, HTTP/selectolax
base_url: "https://mibrofit.tn"
display_name: "Mibrofit"

settings:
  max_retries: 3
  retry_delay: 2
  max_consecutive_failures: 10
  request_timeout: 30
  page_timeout: 30000
  wait_after_load: 1
  max_pagination_pages: 80
  api_per_page: 20

headers:
  Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
  Accept-Language: "fr-FR,fr;q=0.9,en;q=0.8"

api:
  store_categories: "https://mibrofit.tn/wp-json/wc/store/v1/products/categories"
  products_by_category: "https://mibrofit.tn/wp-json/wc/store/v1/products?category={category_id}&per_page={per_page}&page={page}"
  product_by_id: "https://mibrofit.tn/wp-json/wc/store/v1/products/{product_id}"

selectors:
  frontpage:
    category_links: "header a[href*='/categorie-produit/'], nav a[href*='/categorie-produit/'], .menu a[href*='/categorie-produit/'], footer a[href*='/categorie-produit/'], a[href*='/categorie-produit/']"
    robots_url: "https://mibrofit.tn/robots.txt"
    sitemap_index_url: "https://mibrofit.tn/sitemap_index.xml"
    product_cat_sitemap_url: "https://mibrofit.tn/product_cat-sitemap.xml"

  category_page:
    item_selectors:
      - "div.wd-product.product-grid-item"
      - ".products .product-grid-item"
      - ".wd-products .wd-product"
      - ".product-grid-item.product"
    item_url:
      - "h3.wd-entities-title a[href]"
      - "a.product-image-link[href]"
      - ".woocommerce-loop-product__title a[href]"
      - "h2 a[href]"
      - "h3 a[href]"
    item_title:
      - "h3.wd-entities-title a"
      - "h3.wd-entities-title"
      - ".woocommerce-loop-product__title"
      - "h2"
      - "h3"
    item_id:
      - "a.add_to_cart_button[data-product_id]"
      - "button[data-product_id]"
      - "[data-product_id]"
      - "[data-product-id]"
    item_price: "span.price, .price"
    item_current_price:
      - "span.price ins .woocommerce-Price-amount"
      - "span.price ins bdi"
      - "ins .woocommerce-Price-amount"
      - "ins"
    item_old_price:
      - "span.price del .woocommerce-Price-amount"
      - "span.price del bdi"
      - "del .woocommerce-Price-amount"
      - "del"
    item_discount:
      - ".onsale"
      - ".product-label.onsale"
      - ".discount"
    item_image:
      - "img.attachment-large"
      - "img.attachment-woocommerce_thumbnail"
      - "img.wp-post-image"
      - ".product-image-link img"
      - "img"
    item_image_attrs: ["data-large_image", "data-src", "data-lazy-src", "srcset", "data-srcset", "src"]
    pagination_pages: "nav.woocommerce-pagination a.page-numbers[href], .woocommerce-pagination a.page-numbers[href], a.page-numbers[href], link[rel='next'], link[rel='prev']"
    pagination_current: "nav.woocommerce-pagination .page-numbers.current, .woocommerce-pagination .page-numbers.current, .page-numbers.current"
    pagination_next: "nav.woocommerce-pagination a.next.page-numbers[href], .woocommerce-pagination a.next.page-numbers[href], a.next.page-numbers[href], link[rel='next']"

  product_page:
    title:
      - "h1.product_title.entry-title"
      - "h1.product_title"
      - "h1.entry-title"
      - "h1"
    product_id:
      - "button[name='add-to-cart'][value]"
      - "form.cart [name='add-to-cart'][value]"
      - "input[name='product_id'][value]"
      - "[data-product_id]"
      - "[data-product-id]"
    sku:
      - ".sku_wrapper .sku"
      - "span.sku"
      - "[itemprop='sku']"
    price: "p.price .woocommerce-Price-amount, .summary .price .woocommerce-Price-amount, p.price, .summary .price"
    current_price:
      - "p.price ins .woocommerce-Price-amount"
      - ".summary .price ins .woocommerce-Price-amount"
      - "p.price ins"
      - ".summary .price ins"
    old_price:
      - "p.price del .woocommerce-Price-amount"
      - ".summary .price del .woocommerce-Price-amount"
      - "p.price del"
      - ".summary .price del"
    availability:
      - ".summary .stock"
      - ".entry-summary .stock"
      - "form.cart .stock"
      - "p.stock"
      - ".stock"
    short_description: ".woocommerce-product-details__short-description"
    description: "#tab-description, .woocommerce-Tabs-panel--description, .woocommerce-product-details__short-description"
    specs_rows: "table.shop_attributes tr, table.woocommerce-product-attributes tr"
    image_gallery: ".woocommerce-product-gallery__image img, .woocommerce-product-gallery img, img.wp-post-image, meta[property='og:image'], #tab-description img"
    breadcrumbs: ".woocommerce-breadcrumb a, nav.woocommerce-breadcrumb a, .posted_in a[href*='/categorie-produit/'], .product_meta a[href*='/categorie-produit/']"
