# Skymill Shop - Full Playwright scraper
# Platform: React/Next.js + Tailwind CSS (skymil-shop.com)
# base_url redirects: skymil-informatique.com -> www.skymil-shop.com
base_url: "https://skymil-informatique.com"

settings:
  max_retries: 3
  retry_delay: 2
  max_consecutive_failures: 10
  request_timeout: 45
  page_timeout: 45000
  wait_after_load: 3

selectors:
  frontpage:
    wait_selector: "nav[aria-label='Catégories populaires'] a, a[href*='/catalogue/']"
    nav_container: "nav[aria-label='Catégories populaires']"

  category_page:
    item_selector: "div.card-product"
    item_url: "a[href*='/produit/']"
    item_name: "a.font-heading, a.font-bold"
    item_price: "p.font-extrabold"
    item_old_price: "p.line-through"
    item_image: "img[src]"
    pagination_next: "a[rel='next'], a[aria-label='Next']"
    pagination_param: "page"

  product_page:
    title: "h1"
    price: "p.font-extrabold"
    old_price: "p.line-through"
    availability: "span[class*='gaming-success']"
    description: "div[class*='description']"
    image_main: "img[src*='supabase.co']"
