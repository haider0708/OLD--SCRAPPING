# Koktahome.com - WooCommerce, Cloudflare JS challenge, full Playwright
base_url: "https://www.koktahome.com"

settings:
  max_retries: 3
  retry_delay: 3
  max_consecutive_failures: 10
  request_timeout: 60
  page_timeout: 60000
  wait_after_load: 5

selectors:
  frontpage:
    wait_selector: "ul.nav.navbar-nav li.menu-item a, nav.navbar ul.menu-item > a, #menu-menu-principal li > a"
    nav_container: "ul.navbar-nav, #menu-menu-principal"
    top_level_blocks: "li.menu-item"
    top_level_link: "a"
    sub_items: "li.menu-item li.menu-item a"

  category_page:
    item_selector: "div.wd-product, div.product-grid-item.type-product"
    item_id_attr: "data-product_id"
    item_name: "h2.woocommerce-loop-product__title, h3.product-title, .woocommerce-loop-product__title"
    item_url: "a.woocommerce-loop-product__link, a.product-link"
    item_image: "img.attachment-woocommerce_thumbnail, img.wp-post-image"
    item_image_attrs: ["src", "data-src", "data-lazy-src"]
    item_price: "span.woocommerce-Price-amount bdi, span.price bdi"
    item_old_price: "del span.woocommerce-Price-amount bdi"
    pagination_next: "a.next.page-numbers"
    pagination_param: "page"

  product_page:
    title: "h1.product_title, h1.entry-title"
    price: "span.woocommerce-Price-amount bdi, p.price span.woocommerce-Price-amount bdi"
    old_price: "del span.woocommerce-Price-amount bdi"
    sku: "span.sku"
    brand: ".woocommerce-product-attributes td[data-title='Marque'], .pa_marque"
    availability: "p.stock.in-stock, p.stock.out-of-stock, .stock"
    description: "div.woocommerce-product-details__short-description, div#tab-description"
    specs_container: "table.woocommerce-product-attributes"
    specs_key: "th.woocommerce-product-attributes-item__label"
    specs_value: "td.woocommerce-product-attributes-item__value"
    image_main: "div.woocommerce-product-gallery__image img, img.wp-post-image"
    image_thumbnails: "div.flex-viewport img, .woocommerce-product-gallery img"
