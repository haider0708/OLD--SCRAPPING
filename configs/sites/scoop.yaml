# Scoop Gaming - Full Playwright scraper
# Platform: PrestaShop + TvCMS MegaMenu
base_url: "https://www.scoopgaming.com.tn"

settings:
  max_retries: 3
  retry_delay: 2
  max_consecutive_failures: 10
  request_timeout: 45
  page_timeout: 45000
  wait_after_load: 3

selectors:
  frontpage:
    wait_selector: "div#tvdesktop-megamenu ul.menu-content > li.level-1 > a"
    nav_container: "div#tvdesktop-megamenu ul.menu-content"
    top_level_blocks: "ul.menu-content > li.level-1"
    top_level_link: "a"
    top_level_name_span: "a > span"
    low_items_dropdown: "ul.menu-dropdown > li.level-2 > a"
    sub_items_dropdown: "li.level-2.parent > ul.menu-dropdown > li.level-3 > a"

  category_page:
    item_selector: "article.product-miniature[data-id-product]"
    item_id_attr: "data-id-product"
    item_name: "h6[itemprop='name'], div.tvproduct-name.product-title a h6"
    item_url: "div.tvproduct-name.product-title a, a.thumbnail.product-thumbnail"
    item_image: "img.tvproduct-defult-img, img.tv-img-responsive"
    item_image_attrs: ["src", "data-src"]
    item_price: ".product-price-and-shipping span.price"
    item_old_price: ".product-price-and-shipping span.regular-price"
    pagination_next: "a.next.js-search-link[rel='next']"
    pagination_param: "page"

  product_page:
    title: "h1.h1[itemprop='name']"
    price: "div.current-price span[itemprop='price']"
    price_content_attr: "content"
    old_price: "div.product-discount span.regular-price"
    sku: "div.product-reference span[itemprop='sku']"
    brand: "a.tvproduct-brand img"
    brand_attr: "alt"
    availability: "span#product-availability"
    availability_schema: "link[itemprop='availability'][href]"
    description: "div[id^='product-description-short-']"
    full_description: "div.tab-pane#description div.product-description"
    specs_container: "div.product-features dl.data-sheet"
    specs_key: "dt.name"
    specs_value: "dd.value"
    image_main: "div.tvproduct-image-slider img[itemprop='image']"
    image_thumbnails: "img.thumb.js-thumb"
