# Capricelingerie.com.tn - WooCommerce, Playwright
base_url: "https://capricelingerie.com.tn"

settings:
  max_retries: 3
  retry_delay: 2
  max_consecutive_failures: 10
  request_timeout: 60
  page_timeout: 60000
  wait_after_load: 3

selectors:
  frontpage:
    top_level_blocks: "ul.menu > li.menu-item, nav ul > li.menu-item-has-children"
    top_level_link: "> a"
    sub_items: "ul.sub-menu li.menu-item a"

  category_page:
    item_selector: "li.product, article.product, .product-item"
    item_name: "h2.woocommerce-loop-product__title, h3.woocommerce-loop-product__title, .product-title"
    item_url: "a.woocommerce-LoopProduct-link, a[href*='/article/']"
    item_image: "img"
    item_image_attrs: ["src", "data-src", "data-lazy-src"]
    item_price: "span.price .woocommerce-Price-amount"
    item_old_price: "span.price del .woocommerce-Price-amount"
    pagination_next: "a.next.page-numbers, .woocommerce-pagination a.next"
    pagination_pattern: "page/{n}/"

  product_page:
    title: "h1.product_title, h1.entry-title, h1"
    price: "p.price ins .woocommerce-Price-amount, p.price .woocommerce-Price-amount"
    old_price: "p.price del .woocommerce-Price-amount"
    sku: ".sku, [itemprop='sku']"
    availability: ".stock, .in-stock, .out-of-stock"
    description: ".woocommerce-product-details__short-description, #tab-description"
    image_main: ".woocommerce-product-gallery img"
    image_thumbnails: ".woocommerce-product-gallery .flex-viewport img"
    breadcrumb: ".woocommerce-breadcrumb a"
