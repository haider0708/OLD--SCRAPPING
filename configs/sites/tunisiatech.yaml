# Tunisiatech.tn - PrestaShop, no Cloudflare, httpx
base_url: "https://tunisiatech.tn"

settings:
  max_retries: 3
  retry_delay: 2
  max_consecutive_failures: 10
  request_timeout: 30
  page_timeout: 30000
  wait_after_load: 1

selectors:
  frontpage:
    nav_links: "header a[href], #_desktop_top_menu a[href], .top-menu a[href], .menu a[href], .mobile-menu a[href], footer a[href]"
    sitemap_url: "https://tunisiatech.tn/sitemap.xml"

  category_page:
    product_list: "#js-product-list"
    item_selector: "#js-product-list div.product-miniature.js-product-miniature"
    item_id_attr: "data-id-product"
    item_name: ".product-name a"
    item_url: "a.product-cover-link, .product-name a"
    item_image: ".product-thumbnail img"
    item_image_attrs: ["data-original", "data-src", "data-lazy-src", "src"]
    item_price: ".price.product-price"
    item_old_price: ".regular-price"
    item_discount: ".product-flag.discount, .discount-percentage, .discount"
    item_short_description: ".product-description-short"
    item_availability: ".product-availability span"
    pagination_next: "a.next.js-search-link, a[rel='next'], link[rel='next']"
    pagination_links: ".pagination a.js-search-link, .pagination a, link[rel='next'], link[rel='prev']"
    pagination_param: "page"

  product_page:
    product_json: "#product-details[data-product], .js-product-details[data-product]"
    title: "h1.page-heading, h1.h1, h1[itemprop='name'], h1"
    sku: ".product-reference span, span[itemprop='sku']"
    brand: ".product-manufacturer img, .product-manufacturer a"
    brand_attr: "alt"
    price: ".current-price .price, span[itemprop='price']"
    price_attr: "content"
    old_price: ".product-prices .regular-price, .product-discount .regular-price"
    discount: ".discount-percentage, .discount"
    availability: "#product-availability, .js-product-availability"
    description: ".product-description"
    short_description: "div[id^='product-description-short-'], #product-description-short"
    specs_container: ".product-features dl.data-sheet, .product-features"
    specs_key: "dt.name, dt"
    specs_value: "dd.value, dd"
    image_main: ".product-cover img, img[itemprop='image']"
    image_thumbnails: ".images-container img, .product-images img, img.thumb.js-thumb"
