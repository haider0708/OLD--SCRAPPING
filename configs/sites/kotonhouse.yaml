# Koton House - TikTak PRO / Nuxt storefront with public JSON APIs.

site_name: "kotonhouse"
base_url: "https://www.kotonhouse.tn/"
api_base_url: "https://api.tiktak.space/api/v1"
web_api_base_url: "https://www.kotonhouse.tn/api"
company_id: "zjWmyEG"

settings:
  max_retries: 3
  retry_delay: 2
  max_consecutive_failures: 10
  request_timeout: 30
  page_timeout: 30000
  wait_after_load: 1
  page_size: 20
  max_pages: 100

headers:
  Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,application/json;q=0.8,*/*;q=0.7"
  Accept-Language: "fr-FR,fr;q=0.9,en;q=0.8"

selectors:
  frontpage:
    nuxt_data: "script#__NUXT_DATA__"
    standalone_nav_category: "header nav a.nav-item[href*='/product-list/']"
    dropdown_container: "header nav .dropdown-container"
    dropdown_title: ".dropdown-container > span.nav-item"
    dropdown_category: ".dropdown a.dropdown-link[href*='/product-list/']"
    fallback_category_links: "a[href*='/product-list/']"

  categories:
    primary_pattern: "/product-list/{category_id}/{slug}"
    fallback_rollup_links: "footer a[href*='/product-list/']"

  category_page:
    synthetic_payload: "script#kotonhouse-listing-data"
    product_card: "article.product-card"
    product_url: "a.product-link[href]"
    product_name: ".product-title"
    product_price: ".price"
    product_old_price: ".old-price"
    product_discount: ".discount"
    product_availability: ".availability"
    product_image: "img.product-image"
    api_endpoint: "/products-read/"

  pagination:
    method: "api_page"
    page_param: "page"
    page_size: 20

  product_page:
    product_endpoint: "/product/{id}"
    product_extra_endpoint: "/product-extra/{id}"
    title: "h1, meta[property='og:title'][content]"
    description: "meta[name='description'][content], meta[property='og:description'][content]"
    image: "meta[property='og:image'][content]"
    jsonld_product: "script[type='application/ld+json']"
